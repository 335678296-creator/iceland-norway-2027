<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冰岛 × 挪威 · 北极绘本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f7f1e3; --ink:#4a4238; --soft:#8a7f70; --accent:#d9705f;
    --sky:#a8c8dc; --card:#fffdf7; --line:#e0d5c0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"Yuanti SC","YouYuan","PingFang SC",sans-serif;
    background:var(--paper); color:var(--ink); overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    background-image:radial-gradient(ellipse at 20% 10%, rgba(168,200,220,.25), transparent 55%),
                     radial-gradient(ellipse at 85% 85%, rgba(217,112,95,.12), transparent 50%);
  }
  /* ── 章节头 ── */
  header {
    width:min(1240px,100vw); display:flex; justify-content:space-between; align-items:flex-end;
    padding:14px 24px 6px;
  }
  .chapter { font-family:"Ma Shan Zheng","Yuanti SC",cursive; }
  .chapter .c-no { font-size:14px; color:var(--accent); letter-spacing:3px; line-height:1.4; }
  .chapter h1 { font-size:30px; font-weight:400; letter-spacing:2px; line-height:1.25; margin-top:8px; }
  .clockbox { text-align:right; }
  .clockbox .time { font-family:"Gaegu","Yuanti SC",cursive; font-size:30px; font-weight:700; color:var(--ink); }
  .clockbox .date { font-size:13px; color:var(--soft); letter-spacing:1px; }

  /* ── 主体：插画 + 画廊 ── */
  #book {
    width:min(1240px,100vw); flex:1; min-height:0; display:flex; gap:18px; padding:6px 24px 4px;
  }
  #page {
    flex:1; min-width:0; position:relative; border-radius:22px; overflow:hidden;
    background:linear-gradient(180deg,#bcd8ea,#eef3f0);
    border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(74,66,56,.12), inset 0 0 0 6px rgba(255,253,247,.5);
    transition:opacity .45s;
  }
  #scene { position:absolute; inset:0; transition:opacity .45s; }
  #scene.fadeout { opacity:0; }
  #tint { position:absolute; inset:0; pointer-events:none; transition:background 1.2s; mix-blend-mode:multiply; }
  /* 地名横幅 */
  #placename {
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    font-family:"Ma Shan Zheng",cursive; font-size:26px; letter-spacing:4px; color:#3d362c;
    background:rgba(255,253,247,.85); padding:6px 26px; border-radius:30px;
    border:1px solid var(--line); box-shadow:0 3px 10px rgba(74,66,56,.12);
    opacity:0; transition:opacity .6s; white-space:nowrap;
  }
  #placename.show { opacity:1; }
  /* 换国家 */
  #rflash {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(247,241,227,.92); z-index:8; opacity:0; pointer-events:none; transition:opacity .5s;
    font-family:"Ma Shan Zheng",cursive; font-size:38px; letter-spacing:4px; color:#3d362c;
  }
  #rflash.show { opacity:1; }

  /* ── 画廊（照片打开的地方） ── */
  #gallery {
    width:340px; flex-shrink:0; background:var(--card); border-radius:20px;
    border:1px solid var(--line); box-shadow:0 10px 30px rgba(74,66,56,.12);
    padding:14px; display:flex; flex-direction:column; gap:10px; position:relative;
    transition:transform .4s, opacity .4s;
  }
  #gallery.pop { animation:gpop .5s ease; }
  @keyframes gpop { 0% { transform:scale(.94); opacity:.3; } 100% { transform:scale(1); opacity:1; } }
  #g-title { font-size:13px; letter-spacing:2px; color:var(--accent); text-align:center; }
  #g-title b { font-family:"Ma Shan Zheng",cursive; font-size:19px; color:var(--ink); letter-spacing:2px; display:block; margin-top:2px; font-weight:400; }
  #g-frame { position:relative; border-radius:12px; overflow:hidden; background:#dfe8ee; flex:1; min-height:200px; }
  #g-img { width:100%; height:100%; object-fit:cover; display:block; position:absolute; inset:0; transition:opacity .5s; }
  .g-arrow {
    position:absolute; top:50%; transform:translateY(-50%); z-index:3;
    width:32px; height:32px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,253,247,.9); color:var(--ink); font-size:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.2); transition:transform .15s;
  }
  .g-arrow:hover { transform:translateY(-50%) scale(1.12); }
  #g-prev { left:8px; } #g-next { right:8px; }
  #g-cap { font-size:13.5px; color:var(--soft); text-align:center; min-height:20px; letter-spacing:.5px; }
  #g-dots { display:flex; justify-content:center; gap:6px; }
  .g-dot { width:7px; height:7px; border-radius:50%; background:#d8cfbc; cursor:pointer; transition:all .2s; }
  .g-dot.now { background:var(--accent); transform:scale(1.3); }
  #g-note { font-size:11px; color:#b8ad99; text-align:center; letter-spacing:1px; }

  /* ── 叙事卡 ── */
  #story {
    width:min(1240px,100vw); padding:8px 24px;
  }
  #story-card {
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 6px 20px rgba(74,66,56,.1); padding:12px 22px 14px;
    display:flex; gap:16px; align-items:baseline;
  }
  #story-card .s-head { font-size:12.5px; color:var(--accent); letter-spacing:2px; white-space:nowrap; }
  #story-card .s-text { font-size:17px; letter-spacing:1px; line-height:1.5; }
  #story-card .s-text::after { content:"✎"; margin-left:8px; color:#c8bda8; animation:blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* ── 控制 ── */
  #controls { width:min(1240px,100vw); padding:4px 24px 14px; }
  #scrub { width:100%; -webkit-appearance:none; height:6px; border-radius:3px; outline:none;
    background:linear-gradient(90deg,var(--accent) var(--p,0%),#e0d5c0 var(--p,0%)); }
  #scrub::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
    background:var(--card); border:3px solid var(--accent); cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  #ctrl-row { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .cbtn {
    font-family:inherit; font-size:14px; cursor:pointer; letter-spacing:1px;
    background:var(--card); color:var(--ink); border:1.5px solid var(--line);
    padding:7px 16px; border-radius:20px; box-shadow:0 2px 6px rgba(74,66,56,.1);
    transition:all .15s;
  }
  .cbtn:hover { border-color:var(--accent); color:var(--accent); }
  #daychips { display:flex; gap:5px; flex-wrap:wrap; margin-left:auto; }
  .chip {
    font-size:11.5px; min-width:34px; text-align:center; padding:5px 6px; border-radius:12px;
    background:var(--card); color:var(--soft); cursor:pointer; border:1.5px solid var(--line); transition:all .15s;
  }
  .chip.now { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.past { opacity:.5; }

  @media (max-width:900px) {
    body { overflow:auto; }
    #book { flex-direction:column; }
    #page { height:44vh; }
    #gallery { width:100%; }
  }
</style>
</head>
<body>
  <header>
    <div class="chapter">
      <div class="c-no" id="c-no">第一天 · DAY 1/13</div>
      <h1 id="c-title">抵达 + 蓝湖</h1>
    </div>
    <div class="clockbox">
      <div class="time" id="h-clock">00:00</div>
      <div class="date" id="h-date">1月11日 周一 · 冰岛</div>
    </div>
  </header>

  <div id="book">
    <div id="page">
      <div id="scene"></div>
      <div id="tint"></div>
      <div id="placename"></div>
      <div id="rflash"></div>
    </div>
    <div id="gallery">
      <div id="g-title">这个地方长这样<b id="g-place">蓝湖</b></div>
      <div id="g-frame">
        <img id="g-img" alt="">
        <button class="g-arrow" id="g-prev">‹</button>
        <button class="g-arrow" id="g-next">›</button>
      </div>
      <div id="g-cap"></div>
      <div id="g-dots"></div>
      <div id="g-note">📷 实景照片 · 维基百科 · 自动轮播，也可以自己翻</div>
    </div>
  </div>

  <div id="story">
    <div id="story-card">
      <span class="s-head" id="s-head">D1 · 1月11日 周一</span>
      <span class="s-text" id="s-text"></span>
    </div>
  </div>

  <div id="controls">
    <input type="range" id="scrub" min="0" max="1299" value="0">
    <div id="ctrl-row">
      <button class="cbtn" id="btn-play">⏸ 暂停</button>
      <button class="cbtn" id="btn-prev">← 前一天</button>
      <button class="cbtn" id="btn-next">后一天 →</button>
      <button class="cbtn" id="btn-speed">1×</button>
      <div id="daychips"></div>
    </div>
  </div>

function skyAt(region, h){
  const kf = SKY[region]||SKY.ice; let a=kf[0], b=kf[kf.length-1];
  for (let i=0;i<kf.length-1;i++) if (h>=kf[i][0]&&h<=kf[i+1][0]){ a=kf[i]; b=kf[i+1]; break; }
  const f = Math.min(1,Math.max(0,(h-a[0])/((b[0]-a[0])||1)));
  const L=(x,y)=>Math.round(x+(y-x)*f);
  return { top:[L(a[1],b[1]),L(a[2],b[2]),L(a[3],b[3])], bot:[L(a[4],b[4]),L(a[5],b[5]),L(a[6],b[6])],
           stars:a[7]+(b[7]-a[7])*f, sun:a[8]+(b[8]-a[8])*f };
}

function grad(id,a,b){return `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(${a})"/><stop offset="1" stop-color="rgb(${b})"/></linearGradient>`}
function starsSvg(st){
  if (st<0.12) return '';
  let s='';
  for (let i=0;i<28;i++){ const x=(i*173)%600, y=(i*89)%170+8, r=1+(i%3)*0.5;
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fffdf7" opacity="${(st*(0.5+(i%4)*0.15)).toFixed(2)}"/>`; }
  return s;
}
function celestial(sky){
  if (sky.sun>=0){ const x=90+sky.sun*420, y=175-115*Math.sin(Math.PI*Math.min(1,sky.sun));
    return `<circle cx="${x}" cy="${Math.max(40,y)}" r="24" fill="#ffd98e" opacity=".95"/><circle cx="${x}" cy="${Math.max(40,y)}" r="33" fill="#ffd98e" opacity=".25"/>`; }

}

function sceneSVG(locKey, sky, mode){

  const zzz = mode==='sleep' ? `<text x="520" y="210" font-size="30" fill="#8a7f70" font-family="sans-serif">Z z z</text>` : '';
  return `<svg viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="display:block">
    <defs>${grad('sky',sky.top.join(','),sky.bot.join(','))}</defs>

    ${starsSvg(sky.stars)}${celestial(sky)}${clouds(cloudOp)}${mountains(mt[0],mt[1],mt[2])}${fg}${zzz}
  </svg>`;
}

const sceneEl=$('scene'), tintEl=$('tint'), placeEl=$('placename'), flashEl=$('rflash');
const MODE_EMOJI = {car:'🚐', plane:'✈️', boat:'🚢'};

/* 极光罩 */
const aur = document.createElement('div');
aur.style.cssText = 'position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.6s;mix-blend-mode:screen;background:linear-gradient(100deg,transparent 15%,rgba(120,255,190,.4) 38%,rgba(150,160,255,.3) 55%,rgba(120,255,190,.25) 70%,transparent 88%);filter:blur(7px);';
$('page').appendChild(aur);
const st = document.createElement('style');
st.textContent = '@keyframes aurflow{from{transform:translateX(-3%) skewX(-3deg)}to{transform:translateX(3%) skewX(3deg)}}';
document.head.appendChild(st);
aur.style.animation = 'aurflow 8s ease-in-out infinite alternate';
/* 转场计时牌 */
const tbadge = document.createElement('div');
tbadge.style.cssText = 'position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(255,253,247,.9);border:1px solid var(--line);border-radius:20px;padding:5px 18px;font-size:14px;color:var(--ink);display:none;box-shadow:0 3px 10px rgba(74,66,56,.15);letter-spacing:1px;';
$('page').appendChild(tbadge);

function stepAt(tt){
  const di = Math.min(12, Math.floor(tt/24));
  const h = Math.min(23.999, tt - di*24);
  const d = DAYS[di];
  for (let i=0;i<d.steps.length;i++){ const s=d.steps[i]; if (h>=s.t0 && h<s.t1) return {s, di, h, si:i}; }
  return {s:d.steps[d.steps.length-1], di, h, si:d.steps.length-1};
}
function fmtClock(h){ const H=Math.floor(h), M=Math.floor((h-H)*60); return `${String(H).padStart(2,'0')}:${String(M).padStart(2,'0')}`; }

/* ── 画廊 ── */
let gLoc=null, gIdx=0, gTimer=null;
function setGallery(loc){
  if (gLoc===loc) return;
  gLoc=loc; gIdx=0;
  $('g-place').textContent = LOC[loc].n;
  const photos = GALLERY[loc]||[];
  const dots=$('g-dots'); dots.innerHTML='';
  photos.forEach((_,i)=>{ const d=document.createElement('span'); d.className='g-dot'; d.onclick=()=>{showPhoto(i);resetTimer();}; dots.appendChild(d); });
  showPhoto(0, true);
  const gal=$('gallery'); gal.classList.remove('pop'); void gal.offsetWidth; gal.classList.add('pop');
  resetTimer();
  (GALLERY[loc]||[]).slice(1).forEach(u=>{ const im=new Image(); im.src=u; });
}
function showPhoto(i, instant){
  const photos=GALLERY[gLoc]||[]; if(!photos.length) return;
  gIdx=(i+photos.length)%photos.length;
  const img=$('g-img');
  const apply=()=>{ img.src=photos[gIdx];
    img.onload=()=>{img.style.opacity=1;};
    img.onerror=()=>{img.style.opacity=1;};
  };
  if (instant){ apply(); img.style.opacity=1; }
  else { img.style.opacity=0; setTimeout(apply, 240); }
  const caps=CAPS[gLoc]||[''];
  $('g-cap').textContent = caps[gIdx%caps.length]||'';
  [...$('g-dots').children].forEach((d,j)=>d.classList.toggle('now', j===gIdx));
}
function resetTimer(){ clearInterval(gTimer); gTimer=setInterval(()=>showPhoto(gIdx+1), 4500); }
$('g-prev').onclick=()=>{showPhoto(gIdx-1);resetTimer();};
$('g-next').onclick=()=>{showPhoto(gIdx+1);resetTimer();};

/* ── 打字机 ── */
let typeTimer=null;
function typeText(str){
  clearInterval(typeTimer); const el=$('s-text'); el.textContent=''; let i=0;
  typeTimer=setInterval(()=>{ el.textContent=str.slice(0,++i); if(i>=str.length) clearInterval(typeTimer); },42);
}

/* ── 步骤切换 ── */
function onStepChange(s, di, si){
  const isTravel = (s.mode==='car'||s.mode==='plane'||s.mode==='boat') && s.from!==s.to;
  const loc = isTravel ? s.to : s.from;
  const region = s.region || DAYS[di].region;
  const sky = skyAt(region, (s.t0+s.t1)/2 % 24);
  const token = ++swapToken;
  sceneEl.classList.add('fadeout');
  setTimeout(()=>{
    if (token!==swapToken) return;
    sceneEl.innerHTML = isTravel ? travelSVG(s, sky) : sceneSVG(loc, sky, s.mode);
    sceneEl.classList.remove('fadeout');
  }, 420);
  /* 地名横幅 */
  placeEl.classList.remove('show');
  setTimeout(()=>{
    placeEl.textContent = isTravel ? `${MODE_EMOJI[s.mode]} 前往 · ${LOC[s.to].n}` : LOC[loc].b;
    placeEl.classList.add('show');
  }, 500);
  /* 画廊 */
  setGallery(loc);
  /* 换国家 */
  if (curRegion && region!==curRegion){
    flashEl.textContent = REGION_TXT[region]||'';
    flashEl.classList.add('show');
    setTimeout(()=>flashEl.classList.remove('show'), 1500);
  }
  curRegion = region;
  /* 章节头 + 叙事 */
  $('c-no').textContent = `第${CN[di]}天 · DAY ${di+1}/13`;
  $('c-title').textContent = DAYS[di].title;
  $('s-head').textContent = `D${di+1} · ${DAYS[di].date} ${DAYS[di].wd}`;
  typeText(s.label);
  /* 天数 chips */
  [...$('daychips').children].forEach((c,j)=>{ c.classList.toggle('now', j===di); c.classList.toggle('past', j<di); });
  tbadge.style.display = isTravel ? 'block' : 'none';
}

/* ── 主渲染 ── */
function render(){
  const {s, di, h} = stepAt(T);
  const key = di+':'+DAYS[di].steps.indexOf(s);
  if (key!==curStepKey){ curStepKey=key; onStepChange(s, di, DAYS[di].steps.indexOf(s)); }
  const region = s.region || DAYS[di].region;
  const sky = skyAt(region, h);
  tintEl.style.background = `rgba(26,34,72,${(sky.stars*0.34).toFixed(3)})`;
  aur.style.opacity = ((region==='trom'||region==='ice')&&sky.stars>0.55) ? '1' : '0';
  $('h-clock').textContent = fmtClock(h);
  $('h-date').textContent = `${DAYS[di].date} ${DAYS[di].wd} · ${(REGION_TXT[region]||'').replace(/\s*🇮🇸|🇳🇴/g,'')}`;
  /* 转场进度 */
  const isTravel = (s.mode==='car'||s.mode==='plane'||s.mode==='boat') && s.from!==s.to;
  if (isTravel){
    const p = Math.min(1,(h-s.t0)/((s.t1-s.t0)||1));
    const veh = sceneEl.querySelector('#veh');
    if (veh) veh.setAttribute('transform', `translate(${90+p*420},${s.mode==='plane'?140:(s.mode==='car'?316:296)})`);
    const durM = Math.round((s.t1-s.t0)*60), elM = Math.round((h-s.t0)*60);
    tbadge.textContent = `${MODE_EMOJI[s.mode]} 已走 ${elM} 分钟 / 全程 ${durM} 分钟`;
  }
  /* 进度条 */
  const pct = T/TOTAL*100;
  const sc=$('scrub'); sc.value = Math.round(T/TOTAL*1299);
  sc.style.setProperty('--p', pct+'%');
}

/* ── 控件 ── */
const SPEEDS=[1,2,4,8]; let spIdx=0;
function setPlaying(p){ playing=p; $('btn-play').textContent = p?'⏸ 暂停':'▶ 播放'; }
$('btn-play').onclick=()=>{ if(T>=TOTAL) T=0; setPlaying(!playing); };
$('btn-speed').onclick=()=>{ spIdx=(spIdx+1)%SPEEDS.length; speed=SPEEDS[spIdx]; $('btn-speed').textContent=speed+'×'; };
function jumpDay(d){ T=Math.min(TOTAL-0.01, d*24+8.2); }
$('btn-prev').onclick=()=>jumpDay(Math.max(0,Math.floor(T/24)-1));
$('btn-next').onclick=()=>jumpDay(Math.min(12,Math.floor(T/24)+1));
$('scrub').addEventListener('input', e=>{ T=e.target.value/1299*TOTAL; });
const chips=$('daychips');
DAYS.forEach((d,i)=>{ const c=document.createElement('span'); c.className='chip'; c.textContent='D'+(i+1); c.title=d.date+' '+d.title; c.onclick=()=>jumpDay(i); chips.appendChild(c); });

/* ?t=3.6 → 第3天 60% 处，静止定位（截图用） */
const qp=new URLSearchParams(location.search);
if (qp.has('t')){ const v=parseFloat(qp.get('t')); const d=Math.max(1,Math.floor(v)); T=(d-1)*24+(v-d)*24; setPlaying(false); }

let lastNow=performance.now();
function frame(now){
  const dt=(now-lastNow)/1000; lastNow=now;
  if (playing){ T+=dt*RATE*speed; if(T>=TOTAL){T=TOTAL; setPlaying(false);} }
  render();
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(frame);

</script>
</body>
</html>
