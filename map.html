<style>
  :root { --gold:#ffd866; --panel:#1b2132; --line:#3a4666; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#0d1120; }
  body {
    font-family:"Songti SC","STSong",serif; color:#e8e2d2;
    display:flex; flex-direction:column; align-items:center; overflow:hidden;
  }
  #hud {
    width:min(1280px,100vw); display:flex; justify-content:space-between; align-items:center;
    padding:10px 16px 6px; font-family:"Press Start 2P",monospace;
  }
  #hud .day { font-size:14px; color:var(--gold); text-shadow:2px 2px 0 #000; }
  #hud .date { font-size:10px; color:#9aa3b8; margin-top:6px; text-shadow:1px 1px 0 #000; font-family:"Songti SC",serif; letter-spacing:1px;}
  #hud .clock { font-size:16px; color:#fff; text-shadow:2px 2px 0 #000; text-align:right; }
  #hud .phase { font-size:10px; color:#9aa3b8; margin-top:6px; text-shadow:1px 1px 0 #000; font-family:"Songti SC",serif; letter-spacing:1px;}

  #gamewrap {
    position:relative; width:min(1280px,100vw); flex:1; min-height:0;
    display:flex; align-items:center; justify-content:center;
  }
  canvas {
    width:100%; max-height:100%; aspect-ratio:16/9; display:block;
    image-rendering:pixelated; image-rendering:crisp-edges;
    border:4px solid var(--line); border-radius:6px;
    box-shadow:0 0 0 4px #0d1120, 0 12px 40px rgba(0,0,0,.6);
    background:#000;
  }
  /* 地点大招牌 */
  #banner {
    position:absolute; top:14%; left:50%; transform:translate(-50%,-10px);
    font-size:30px; letter-spacing:6px; color:#fff; white-space:nowrap;
    text-shadow:3px 3px 0 #000, -1px -1px 0 #000, 0 0 24px rgba(255,216,102,.5);
    opacity:0; transition:all .5s; pointer-events:none; font-weight:700;
  }
  #banner.show { opacity:1; transform:translate(-50%,0); }
  #banner small { display:block; text-align:center; font-size:12px; letter-spacing:8px; color:var(--gold); margin-top:6px;
    font-family:"Press Start 2P",monospace; }

  /* RPG 对话框 */
  #dialog {
    position:absolute; left:4%; right:4%; bottom:4%;
    background:rgba(15,20,36,.92); border:3px solid var(--gold); border-radius:8px;
    box-shadow:0 0 0 3px #0d1120, inset 0 0 0 1px rgba(255,216,102,.25);
    padding:12px 18px 14px; min-height:74px;
  }
  #dialog .d-head { font-size:12px; color:var(--gold); letter-spacing:2px; margin-bottom:6px; }
  #dialog .d-text { font-size:18px; line-height:1.5; letter-spacing:1px; }
  #dialog .d-next {
    position:absolute; right:14px; bottom:8px; color:var(--gold);
    animation:blink 1s steps(2) infinite; font-size:14px;
  }
  @keyframes blink { 50% { opacity:0; } }

  /* 控制区 */
  #controls { width:min(1280px,100vw); padding:10px 16px 14px; }
  #scrub { width:100%; -webkit-appearance:none; height:8px; border-radius:4px; outline:none;
    background:linear-gradient(90deg,var(--gold) var(--p,0%),#2a3350 var(--p,0%)); border:2px solid #0d1120; }
  #scrub::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; background:var(--gold);
    border:3px solid #0d1120; box-shadow:0 0 0 2px var(--gold); cursor:pointer; }
  #ctrl-row { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .cbtn {
    font-family:"Press Start 2P",monospace; font-size:11px; cursor:pointer;
    background:#232c44; color:var(--gold); border:3px solid #0d1120;
    box-shadow:0 0 0 2px var(--line), inset -2px -2px 0 rgba(0,0,0,.4);
    padding:9px 14px; border-radius:6px; letter-spacing:1px;
  }
  .cbtn:active { transform:translateY(2px); }
  #daychips { display:flex; gap:5px; flex-wrap:wrap; margin-left:auto; }
  .chip {
    font-family:"Press Start 2P",monospace; font-size:9px; min-width:34px; text-align:center;
    padding:7px 4px; background:#1b2132; color:#7c8598; border-radius:5px; cursor:pointer;
    border:2px solid #0d1120; box-shadow:0 0 0 1px var(--line);
  }
  .chip.now { background:var(--gold); color:#1b2132; }
  .chip.past { color:#4a5470; }

  /* 实景照片（宝丽来） */
  #polaroid {
    position:absolute; top:10px; left:12px; width:158px; z-index:15;
    background:#f5f2ea; padding:7px 7px 4px; transform:rotate(-2.5deg);
    box-shadow:0 6px 18px rgba(0,0,0,.5); transition:opacity .4s;
  }
  #polaroid img { width:100%; height:96px; object-fit:cover; display:block; background:#2a3350; }
  #polaroid .cap { font-size:12px; color:#3a3230; text-align:center; padding:4px 2px 3px;
    letter-spacing:.5px; line-height:1.3; }
  #polaroid .src { font-size:8px; color:#9a938a; text-align:center; letter-spacing:1px; }

  /* 行程迷你地图 */
  #minimap { width:min(1280px,100vw); padding:2px 16px 8px; }
  #mm-track { display:flex; height:16px; border:2px solid #0d1120; box-shadow:0 0 0 2px var(--line);
    border-radius:4px; position:relative; }
  .mm-seg { flex:1; font-family:"Press Start 2P",monospace; font-size:8px; color:rgba(13,17,32,.75);
    display:flex; align-items:center; justify-content:center; border-right:1px solid rgba(13,17,32,.3); }
  .mm-seg.ice { background:#7fa8c8; } .mm-seg.trom { background:#a394d0; } .mm-seg.osl { background:#8ec69a; }
  .mm-seg.dim { opacity:.45; }
  #mm-marker { position:absolute; top:-7px; width:2px; height:26px; background:var(--gold);
    box-shadow:0 0 8px var(--gold); }
  #mm-marker::after { content:"▼"; position:absolute; top:-11px; left:-5px; color:var(--gold); font-size:10px; }
  #mm-labels { display:flex; margin-top:5px; font-size:11px; color:#9aa3b8; letter-spacing:2px; }
  #mm-labels span { text-align:center; }

  /* 换国家全屏提示 */
  #rflash {
    position:absolute; top:36%; left:50%; transform:translate(-50%,-50%) scale(.9); z-index:18;
    font-size:32px; letter-spacing:4px; color:#fff; white-space:nowrap;
    text-shadow:3px 3px 0 #000, 0 0 30px rgba(255,216,102,.6);
    opacity:0; transition:all .45s; pointer-events:none; font-weight:700;
  }
  #rflash.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
</style>

function TXT(t,x,y,c,font='7px "Songti SC",serif'){ ctx.font=font; ctx.fillStyle='#0d1120'; ctx.fillText(t,Math.round(x)+1,Math.round(y)+1); ctx.fillStyle=c; ctx.fillText(t,Math.round(x),Math.round(y)); }

const steamP = Array.from({length:10},()=>({o:Math.random()*30,ph:Math.random()*6}));

function mountains(camX, skyBot, starsA){
  const dark = starsA>.5 ? '#141a30' : '#5a6a8c';
  const mid  = starsA>.5 ? '#1c2440' : '#7c8cac';
  ctx.fillStyle = dark;
  for (let i=-1;i<6;i++){ const bx = i*160 - (camX*.25)%160; ctx.beginPath();
    ctx.moveTo(bx,190); ctx.lineTo(bx+80,90+((i*37)%40)); ctx.lineTo(bx+160,190); ctx.fill(); }
  ctx.fillStyle = mid;
  for (let i=-1;i<7;i++){ const bx = i*130 - (camX*.45)%130; ctx.beginPath();
    ctx.moveTo(bx,196); ctx.lineTo(bx+65,130+((i*53)%30)); ctx.lineTo(bx+130,196); ctx.fill(); }
}

/* ═════════ 场景绘制（sx = 屏幕 x） ═════════ */

    for(let i=0;i<6;i++){ const bx=sx-70+i*26, bh=30+((i*29)%38);

      for(let wy=GY-bh+4;wy<GY-4;wy+=7) for(let wx2=bx+3;wx2<bx+18;wx2+=6)
        if((i*wy+wx2)%3===0) R(wx2,wy,3,4,night?'#ffd866':'#8a97a8');

  blacksand(sx,t){
    for(let i=0;i<5;i++) R(sx-60+i*14,GY-26-((i*17)%14),9,26+((i*17)%14),'#3a3d45'); // 玄武岩柱
    const w=Math.sin(t*2)*3;
    R(sx+30,GY-6+w,70,8,'#2e4a66'); R(sx+30,GY-8+w,70,2,'#f0f8ff');   // 浪
  },
  glacier(sx,t){
    R(sx-110,GY-70,60,68,'#d8ecf4'); R(sx-104,GY-64,48,10,'#b8dcf0'); // 冰川墙
    R(sx-110,GY-70,60,4,'#f0f8ff');
    R(sx-90,GY-2,180,12,'#5a8aa8');                                    // 湖水
    R(sx-40,GY-8,18,7,'#e8f4fc'); R(sx+10,GY-6,12,5,'#d8ecf4'); R(sx+50,GY-9,22,8,'#e8f4fc'); // 浮冰
  },
  town(sx,t,night){
    const cols=['#bf616a','#d8a657','#7d9a5a','#5a8aa8','#a37ba8'];
    for(let i=0;i<5;i++){ const bx=sx-90+i*30, bh=18+((i*13)%12);
      R(bx,GY-bh,26,bh,cols[i]); R(bx,GY-bh-5,26,5,'#2e3440');
      R(bx+5,GY-bh+5,5,6,night?'#ffd866':'#e5e9f0'); R(bx+15,GY-bh+5,5,6,night?'#ffd866':'#e5e9f0'); }
    R(sx+62,GY-46,12,46,'#8a97a8'); R(sx+58,GY-52,20,6,'#8a97a8');     // 教堂塔
    R(sx+65,GY-56,6,4,'#e5e9f0');
  },
  harbor(sx,t,night){
    R(sx-120,GY-60,240,26,'rgba(58,70,102,.7)');                       // 远山
    SC.town(sx-30,t,night);
    R(sx-120,GY,240,14,'#2e4a66');                                     // 海港
    R(sx-70,GY-4,22,5,'#8f5b3c'); R(sx-64,GY-10,8,6,'#e5e9f0');        // 小船
    R(sx+40,GY-4,26,5,'#4c566a'); R(sx+47,GY-11,10,7,'#d8ecf4');
  },
  cable(sx,t){
    R(sx-90,GY-96,180,96,'#3b4252'); R(sx-90,GY-96,180,10,'#e5e9f0');  // 雪山
    R(sx-14,GY-10,28,10,'#4c566a');                                    // 缆车站
    ctx.strokeStyle='#8a97a8'; ctx.beginPath(); ctx.moveTo(sx,GY-14); ctx.lineTo(sx+60,GY-88); ctx.stroke();
    const f=(t*6%40)/40, cx2=sx+f*60, cy2=GY-14-f*74;
    R(cx2-4,cy2,8,7,'#d95763'); R(cx2-3,cy2+1,6,3,'#8fd8e8');          // 移动的缆车
  },
  cathedral(sx,t,night){
    ctx.fillStyle='#e5e9f0'; ctx.beginPath();
    ctx.moveTo(sx-36,GY); ctx.lineTo(sx,GY-58); ctx.lineTo(sx+36,GY); ctx.fill();
    R(sx-3,GY-40,6,40,'#2e3440'); R(sx-20,GY-12,10,8,night?'#ffd866':'#2e3440'); R(sx+10,GY-12,10,8,night?'#ffd866':'#2e3440');
  },
  sea(sx,t){
    R(sx-130,GY-34,260,34+62,'#2e4a66');                               // 大海
    R(sx-130,GY-34,260,3,'#5a8aa8');
    const ph=t%6;
    if(ph<2){ R(sx-8,GY-42,16,10,'#2e3440'); ctx.fillStyle='#2e3440'; ctx.beginPath(); // 鲸鱼尾
      ctx.moveTo(sx,GY-42); ctx.lineTo(sx-10,GY-54); ctx.lineTo(sx+10,GY-54); ctx.fill(); }
    if(ph>.4&&ph<1.4) R(sx-2,GY-60-Math.sin(ph)*8,4,10,'#d8ecf4');     // 喷水
  },
  fjordtown(sx,t,night){
    R(sx-110,GY-56,80,56,'#3b4252'); R(sx+30,GY-64,90,64,'#434c5e');
    R(sx-110,GY-56,80,7,'#e5e9f0'); R(sx+30,GY-64,90,7,'#e5e9f0');
    R(sx-40,GY,110,12,'#2e4a66');
    R(sx-24,GY-16,16,12,'#bf616a'); R(sx-2,GY-14,14,10,'#d8a657');
    R(sx-20,GY-13,4,4,night?'#ffd866':'#e5e9f0');
  },
  camp(sx,t,night){
    ctx.fillStyle='#d8a657'; ctx.beginPath(); ctx.moveTo(sx-40,GY); ctx.lineTo(sx-26,GY-22); ctx.lineTo(sx-12,GY); ctx.fill(); // 帐篷
    ctx.fillStyle='#bf616a'; ctx.beginPath(); ctx.moveTo(sx+6,GY); ctx.lineTo(sx+20,GY-20); ctx.lineTo(sx+34,GY); ctx.fill();
    R(sx-4,GY-3,20,3,'#6b4a33');                                        // 雪橇
    R(sx+44,GY-8,12,6,'#8a6a4a'); R(sx+54,GY-11,5,5,'#8a6a4a'); R(sx+46,GY-2,2,2,'#4a3222'); R(sx+52,GY-2,2,2,'#4a3222'); // 狗
    R(sx+62,GY-8,12,6,'#9a7a5a'); R(sx+72,GY-11,5,5,'#9a7a5a');
  },
  snowfield(sx,t,night){
    R(sx-50,GY-14,6,14,'#2e4a3a'); R(sx-52,GY-18,10,6,'#3a5a4a');       // 小树
    R(sx+44,GY-12,5,12,'#2e4a3a'); R(sx+42,GY-16,9,5,'#3a5a4a');
    const fl=Math.sin(t*9)*2;
    R(sx-3,GY-4,7,3,'#6b4a33');                                          // 篝火
    R(sx-1,GY-10-fl,5,6+fl,'#e8a04c'); R(sx+1,GY-8-fl,3,4,'#ffd866');
    R(sx-1,GY-16-fl*2,3,3,'rgba(200,200,200,.4)');
  },
  hotel(sx,t,night){
    R(sx-24,GY-64,48,64,'#3b4252'); R(sx-24,GY-64,48,6,'#d8a657');
    for(let wy=GY-54;wy<GY-6;wy+=10) for(let bx=sx-18;bx<sx+20;bx+=11)
      R(bx,wy,6,6,night&&((bx+wy)%3===0)?'#ffd866':'#5a6a8c');
    TXT('HOTEL',sx-16,GY-68,'#ffd866','6px monospace');
  },
  opera(sx,t){
    ctx.fillStyle='#f0f4f8'; ctx.beginPath();
    ctx.moveTo(sx-60,GY); ctx.lineTo(sx+30,GY-40); ctx.lineTo(sx+70,GY); ctx.fill();
    R(sx+30,GY-40,6,6,'#d8ecf4');
    R(sx+78,GY-52,10,52,'#4c566a'); R(sx+92,GY-46,10,46,'#3b4252'); R(sx+106,GY-58,10,58,'#434c5e'); // barcode
  },
  restaurant(sx,t,night){
    R(sx-34,GY-26,68,26,'#5a3d2b'); R(sx-38,GY-30,76,5,'#2e3440');
    R(sx-26,GY-18,20,14,night?'#ffd866':'#8fd8e8'); R(sx+8,GY-18,20,14,night?'#ffd866':'#8fd8e8');
    TXT('★★',sx-8,GY-32,'#ffd866','7px monospace');
  },
};

/* ═════════ 角色与载具 ═════════ */
function person(sx,fy,frame){
  const x=Math.round(sx);
  if(frame===0){ R(x-3,fy-5,3,5,'#2e3440'); R(x+1,fy-5,3,5,'#2e3440'); }
  else { R(x-4,fy-4,3,4,'#2e3440'); R(x+2,fy-5,3,5,'#2e3440'); }
  R(x-4,fy-12,9,8,'#d95763');                       // 红外套
  R(x-4,fy-12,9,2,'#ffd866');                       // 金围巾
  R(x-3,fy-16,7,5,'#f2d0b3');                       // 脸
  R(x-4,fy-19,9,4,'#5a8aa8'); R(x-1,fy-21,3,3,'#f0f4f8'); // 毛线帽+绒球
}
function van(sx,fy,t){
  const x=Math.round(sx), b=Math.round(Math.sin(t*14)*.7);
  R(x-15,fy-12+b,30,9,'#e5e9f0'); R(x-15,fy-8+b,30,3,'#5a8aa8');
  R(x-12,fy-11+b,6,4,'#8fd8e8'); R(x-4,fy-11+b,6,4,'#8fd8e8'); R(x+4,fy-11+b,6,4,'#8fd8e8');
  R(x-11,fy-3,5,4,'#2e3440'); R(x+6,fy-3,5,4,'#2e3440');
}
function plane(sx,sy,flip){
  const x=Math.round(sx), y=Math.round(sy);
  R(x-16,y-3,32,6,'#e5e9f0'); R(x+10,y-8,5,6,'#d95763');
  R(x-4,y-1,12,3,'#b8c4d8'); R(x-14,y-2,4,2,'#8fd8e8'); R(x-8,y-2,4,2,'#8fd8e8'); R(x-2,y-2,4,2,'#8fd8e8');
}
function boat(sx,fy,t){
  const x=Math.round(sx), b=Math.sin(t*2.4)*1.5;
  R(x-14,fy-4+b,28,6,'#4c566a'); R(x-17,fy-5+b,4,3,'#4c566a');
  R(x-6,fy-11+b,12,7,'#e5e9f0'); R(x-4,fy-9+b,8,3,'#8fd8e8');
}

/* ═════════ 引擎 ═════════ */
const banner = document.getElementById('banner');
const dHead = document.getElementById('d-head'), dText = document.getElementById('d-text');
const scrub = document.getElementById('scrub');
let T=0.02, playing=true, speed=1, lastTs=null, camX=0, tt=0;
let curDay=-1, curStep=-1, chars=0, bannerKey='', bannerUntil=0, dragging=false;

const q = new URLSearchParams(location.search);
if (q.has('t')){ T=parseFloat(q.get('t'))||0; playing=false; document.getElementById('btn-play').textContent='▶'; }

const chipEls = DAYS.map((d,i)=>{ const c=document.createElement('span'); c.className='chip';
  c.textContent='D'+(i+1); c.onclick=()=>{T=i+0.02;}; daychips.appendChild(c); return c; });

function showBanner(key){
  banner.textContent = '〜 '+LOC[key].b+' 〜';
  banner.classList.add('show');
  bannerUntil = tt + 2.6;
}
function fmtH(h){ const H=Math.floor(h)%24,M=Math.round((h%1)*60); return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0'); }

/* ── 实景照片框 ── */
const pola=document.getElementById('polaroid'), pimg=document.getElementById('pimg'), pcap=document.getElementById('pcap');
let photoKey='';
function updatePhoto(st){
  const key = st.mode==='sleep' ? st.from : st.to;
  if(key===photoKey) return; photoKey=key;
  const url = PHOTOS[key];
  if(!url){ pola.style.opacity=0; return; }
  pola.style.opacity=1; pimg.src=url;
  pcap.textContent = (st.mode==='sleep'||st.label.startsWith('🍽')) ? st.label.slice(0,20) : LOC[key].b;
}
pimg.onerror=()=>{ pola.style.opacity=0; };

/* ── 换国家提示 ── */
const rflash=document.getElementById('rflash');
let prevRegion=DAYS[0].steps[0].region||'ice', rfUntil=0;
function regionFlash(a,b){
  if(a===b||!a) return;
  const names={ice:'🇮🇸 冰岛',trom:'🇳🇴 挪威 · 特罗姆瑟',osl:'🇳🇴 挪威 · 奥斯陆'};
  rflash.textContent=`${names[a]||a} ✈️ ${names[b]||b}`;
  rflash.classList.add('show'); rfUntil=tt+3;
}

/* ── 迷你地图 ── */
const mmTrack=document.getElementById('mm-track');
const mmSegs=DAYS.map((d,i)=>{ const s=document.createElement('div');
  s.className='mm-seg '+d.region; s.textContent='D'+(i+1); mmTrack.appendChild(s); return s; });
const mmMarker=document.createElement('div'); mmMarker.id='mm-marker'; mmTrack.appendChild(mmMarker);

function frame(ts){
  if(lastTs===null) lastTs=ts;
  const dt=Math.min(.1,(ts-lastTs)/1000); lastTs=ts; tt+=dt*speed;
  if(playing){ T+=dt*speed/8; if(T>=12.999){T=12.999;playing=false;document.getElementById('btn-play').textContent='↺';} }

  const di=Math.min(12,Math.floor(T)), h=(T-di)*24, d=DAYS[di];
  let si=0; for(let i=0;i<d.steps.length;i++) if(h>=d.steps[i].t0&&h<d.steps[i].t1){si=i;break;}
  const st=d.steps[si], region=st.region||d.region;
  const sky=skyAt(region,h), night=sky.stars>.5;

  if(di!==curDay){ curDay=di;
    chipEls.forEach((c,i)=>{c.classList.toggle('now',i===di);c.classList.toggle('past',i<di);});
    document.getElementById('h-day').textContent=`DAY ${di+1}/13`;
    document.getElementById('h-date').textContent=`${d.date} ${d.wd} · ${d.title}`;
    dHead.textContent=`D${di+1} · ${d.date} ${d.wd} · ${d.title}`;
  }
  if(si!==curStep){ curStep=si; chars=0;
    if(st.label.startsWith('🍽') || st.mode==='sleep'){ bannerKey='';
      banner.textContent=st.label; banner.classList.add('show'); bannerUntil=tt+2.6; }
    else if(st.to!==bannerKey){ bannerKey=st.to; showBanner(st.to); }
    updatePhoto(st);
    if(region!==prevRegion){ regionFlash(prevRegion,region); prevRegion=region; }
  }
  if(banner.classList.contains('show') && tt>bannerUntil) banner.classList.remove('show');

  // 打字机
  chars=Math.min(st.label.length, chars+dt*speed*22);
  dText.textContent = st.label.slice(0,Math.floor(chars));

  // ── 天空 ──
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`rgb(${sky.top})`); g.addColorStop(.75,`rgb(${sky.bot})`); g.addColorStop(1,`rgb(${sky.bot})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // 星星
  if(sky.stars>.05){ stars.forEach(s=>{ ctx.globalAlpha=sky.stars*(.4+.6*Math.abs(Math.sin(tt*1.5+s.tw)));
    R(s.x,s.y,s.r,s.r,'#dfe8ff'); }); ctx.globalAlpha=1; }

  // 极光
  if(region==='trom'&&sky.stars>.4){
    ctx.save(); ctx.globalAlpha=.55*sky.stars;
    for(let b=0;b<3;b++){ ctx.beginPath();
      const base=36+b*18, amp=10+b*4;
      for(let x=0;x<=W;x+=16){ const y=base+Math.sin(x*.02+tt*(.5+b*.2)+b*2)*amp;
        x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
      ctx.strokeStyle=b===1?'#7dffb2':'#5ac8a0'; ctx.lineWidth=9-b*2; ctx.globalAlpha=(.4-b*.1)*sky.stars; ctx.stroke(); }
    ctx.restore(); ctx.globalAlpha=1;
  }

  // 太阳/月亮
  if(sky.sun>.02){ const az=Math.min(1,Math.max(0,(h-9)/8));
    R(30+az*150, 84-sky.sun*44, 12,12,'#f5d78e'); R(28+az*150,82-sky.sun*44,16,16,'rgba(245,215,142,.3)'); }
  else { ctx.globalAlpha=sky.stars; R(380,36,10,10,'#dfe6f5'); R(383,34,9,10,`rgb(${sky.top})`); ctx.globalAlpha=1; }

  // 远山地平线 + 地面
  mountains(camX, sky.bot, sky.stars);
  const groundC = st.from==='black'&&st.to==='black' ? '#26292f' : '#e8ecf4';
  const groundC2 = st.from==='black'&&st.to==='black' ? '#1d2025' : '#d4dbe8';
  R(0,GY,W,H-GY,groundC); R(0,GY,W,3,groundC2);
  for(let i=0;i<40;i++) R((i*37-camX*.9)%W, GY+6+(i*13)%(H-GY-8), 3,2, groundC2);

  // ── 场景（视野内） ──
  for(const k in LOC){ const sx=wx(k)-camX;
    if(sx>-160&&sx<W+160){
      const sc=(st.view&&(k===st.from||k===st.to))?st.view:LOC[k].sc;
      SC[sc](sx, tt, night);
      if(Math.abs(sx-240)<300) TXT(LOC[k].n, sx-LOC[k].n.length*3.5, GY+16, night?'#e8e2d2':'#3b4252'); } }

  // ── 角色/载具位置 ──
  const f=st.t1>st.t0?(h-st.t0)/(st.t1-st.t0):0, fc=Math.min(1,Math.max(0,f));
  const x1=wx(st.from), x2=wx(st.to);
  let charX=x1, sprite='person', planeY=0;
  if(st.mode==='car'){ charX=x1+(x2-x1)*fc; sprite='van'; }
  else if(st.mode==='boat'){ charX=x1+(x2-x1)*fc; sprite='boat'; }
  else if(st.mode==='plane'){ charX=x1+(x2-x1)*fc; sprite='plane'; planeY=Math.sin(fc*Math.PI)*120; }
  else if(st.mode==='walk'&&x1===x2){ charX=x1+Math.sin(tt*.9)*22; }   // 原地溜达
  else charX=x1+(x2-x1)*fc;

  // 相机
  const target=Math.max(0,Math.min(WORLD_W+PAD*2-W, charX-W/2));
  camX += (target-camX)*Math.min(1,dt*5);

  const sx=charX-camX;
  const isFood=st.label.startsWith('🍽');
  if(st.mode==='sleep'){
    if(!['hotel','manor'].includes(LOC[st.from].sc)) SC.hotel(sx+50, tt, true);
    person(sx, GY, 0);
    const zo=(tt%2)/2; ctx.globalAlpha=1-zo;
    TXT('z', sx+8, GY-26-zo*12, '#dfe8ff', '8px monospace'); ctx.globalAlpha=1;
  } else if(sprite==='van') van(sx, GY, tt);
  else if(sprite==='boat'){ boat(sx, GY, tt); person(sx+6, GY-4, 0); }
  else if(sprite==='plane'){ plane(sx, GY-30-planeY, 1);
    if(planeY>30) for(let i=0;i<3;i++) R(sx-26-i*8, GY-30-planeY-1, 5,2,'rgba(255,255,255,.5)'); }
  else if(LOC[st.from].sc==='sea'){ boat(sx, GY-32, tt); person(sx+6, GY-36, 0); }
  else {
    if(isFood){ // 晚餐：暖灯 + 餐桌
      R(sx-18,GY-9,26,3,'#8f5b3c'); R(sx-16,GY-6,3,6,'#6b4a33'); R(sx+4,GY-6,3,6,'#6b4a33');
      R(sx-14,GY-11,7,2,'#f0f4f8'); R(sx-2,GY-11,7,2,'#f0f4f8');
      R(sx+16,GY-26,2,26,'#2e3440'); R(sx+12,GY-30,10,4,'#ffd866');
      ctx.globalAlpha=.22; R(sx+10,GY-26,14,26,'#ffd866'); ctx.globalAlpha=1;
    }
    person(sx, GY, (st.mode==='walk')?Math.floor(tt*7)%2:0);
  }
  // 车程/航程计时牌
  if(['car','boat','plane'].includes(st.mode)){
    const tot=st.t1-st.t0, elap=Math.max(0,Math.min(tot,h-st.t0));
    const fd=v=>`${Math.floor(v)}:${String(Math.round((v%1)*60)).padStart(2,'0')}`;
    const ic={car:'🚐 车程',boat:'🚢 船程',plane:'✈️ 航程'}[st.mode];
    TXT(`${ic} ${fd(elap)} / ${fd(tot)}`, sx-40, GY-38-planeY, '#ffd866');
  }

  // 雪
  snow.forEach(s=>{ s.y+=s.v*speed; s.x+=Math.sin(tt+s.ph)*.4;
    if(s.y>H){s.y=-2;s.x=Math.random()*W;} if(s.x<0)s.x=W; if(s.x>W)s.x=0;
    ctx.globalAlpha=.7; R(s.x,s.y,s.s,s.s,'#fff'); }); ctx.globalAlpha=1;

  // HUD + 迷你地图
  document.getElementById('h-clock').textContent=fmtH(h);
  document.getElementById('h-phase').textContent=phaseTxt(region,h,sky.stars)+' · '+REGION_TXT[region];
  mmMarker.style.left=`calc(${(T/13*100).toFixed(2)}% - 1px)`;
  mmSegs.forEach((s,i)=>s.classList.toggle('dim',i<di));
  if(rflash.classList.contains('show')&&tt>rfUntil) rflash.classList.remove('show');
  if(!dragging){ scrub.value=Math.round(T*100); scrub.style.setProperty('--p',(T/13*100)+'%'); }

  requestAnimationFrame(frame);
}

/* ═════════ 控件 ═════════ */
document.getElementById('btn-play').onclick=e=>{
  if(T>=12.999){T=0;playing=true;e.target.textContent='❚❚';return;}
  playing=!playing; e.target.textContent=playing?'❚❚':'▶'; };
document.getElementById('btn-prev').onclick=()=>{T=Math.max(0,Math.floor(T)-1+0.02);};
document.getElementById('btn-next').onclick=()=>{T=Math.min(12.02,Math.floor(T)+1+0.02);};
document.getElementById('btn-speed').onclick=e=>{speed=speed===1?2:speed===2?4:1;e.target.textContent=speed+'×';};
scrub.addEventListener('pointerdown',()=>dragging=true);
scrub.addEventListener('pointerup',()=>dragging=false);
scrub.addEventListener('input',()=>{T=scrub.value/100;});

requestAnimationFrame(frame);
</script>
</body>
