<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冰岛 × 挪威 · 游戏大地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#f7f1e3; --ink:#4a4238; --soft:#8a7f70; --accent:#d9705f;
    --card:#fffdf7; --line:#e0d5c0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"Yuanti SC","YouYuan","PingFang SC",sans-serif;
    background:var(--paper); color:var(--ink); overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
  }
  header { width:min(1280px,100vw); display:flex; justify-content:space-between; align-items:flex-end; padding:12px 24px 6px; }
  .chapter .c-no { font-size:13px; color:var(--accent); letter-spacing:3px; line-height:1.4; }
  .chapter h1 { font-family:"Ma Shan Zheng","Yuanti SC",cursive; font-size:28px; font-weight:400; letter-spacing:2px; line-height:1.25; margin-top:6px; }
  .clockbox { text-align:right; }
  .clockbox .time { font-family:"Gaegu","Yuanti SC",cursive; font-size:28px; font-weight:700; }
  .clockbox .date { font-size:12.5px; color:var(--soft); letter-spacing:1px; }

  /* ── 游戏舞台 ── */
  #stage {
    width:min(1280px,100vw); flex:1; min-height:0; position:relative; overflow:hidden;
    border-radius:22px; border:1px solid var(--line); margin:4px 24px;
    width:calc(min(1280px,100vw) - 48px);
    box-shadow:0 10px 30px rgba(74,66,56,.14), inset 0 0 0 6px rgba(255,253,247,.5);
    background:#a8c8dc; transition:background 1.4s;
  }
  #stage svg.lay { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #sunmoon { position:absolute; font-size:0; pointer-events:none; transition:opacity 1s; }
  #tint { position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; transition:background 1.4s; z-index:5; }
  #aurora { position:absolute; inset:0; pointer-events:none; opacity:0; transition:opacity 1.6s; z-index:4;
    mix-blend-mode:screen; filter:blur(7px);
    background:linear-gradient(100deg,transparent 15%,rgba(120,255,190,.42) 38%,rgba(150,160,255,.3) 55%,rgba(120,255,190,.26) 70%,transparent 88%);
    animation:aurflow 8s ease-in-out infinite alternate; }
  @keyframes aurflow { from{transform:translateX(-3%) skewX(-3deg)} to{transform:translateX(3%) skewX(3deg)} }

  /* 地名横幅 */
  #placename {
    position:absolute; top:14px; left:50%; transform:translateX(-50%); z-index:10;
    font-family:"Ma Shan Zheng",cursive; font-size:24px; letter-spacing:4px; color:#3d362c;
    background:rgba(255,253,247,.88); padding:5px 24px; border-radius:30px;
    border:1px solid var(--line); box-shadow:0 3px 10px rgba(74,66,56,.14);
    opacity:0; transition:opacity .5s; white-space:nowrap;
  }
  #placename.show { opacity:1; }
  /* 换国家 */
  #rflash {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:20;
    background:rgba(247,241,227,.9); opacity:0; pointer-events:none; transition:opacity .5s;
    font-family:"Ma Shan Zheng",cursive; font-size:40px; letter-spacing:5px; color:#3d362c;
  }
  #rflash.show { opacity:1; }
  /* 转场计时牌 */
  #tbadge {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:10; display:none;
    background:rgba(255,253,247,.92); border:1px solid var(--line); border-radius:20px;
    padding:6px 18px; font-size:14px; letter-spacing:1px; box-shadow:0 3px 10px rgba(74,66,56,.15); white-space:nowrap;
  }
  /* 照片卡（到达目的地弹出） */
  #photo {
    position:absolute; top:64px; right:16px; width:270px; z-index:12;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 10px 26px rgba(74,66,56,.2); padding:10px;
    transform-origin:top right; transition:transform .35s, opacity .35s;
  }
  #photo.pop { animation:photopop .45s ease; }
  @keyframes photopop { 0%{transform:scale(.8) rotate(3deg); opacity:0} 60%{transform:scale(1.04) rotate(-1deg)} 100%{transform:scale(1) rotate(0)} }
  #photo.away { transform:scale(.85); opacity:.35; }
  #p-frame { position:relative; border-radius:10px; overflow:hidden; background:#dfe8ee; height:170px; }
  #p-img { width:100%; height:100%; object-fit:cover; display:block; transition:opacity .4s; }
  .p-arrow { position:absolute; top:50%; transform:translateY(-50%); z-index:3; width:26px; height:26px; border-radius:50%; border:none; cursor:pointer; background:rgba(255,253,247,.92); color:var(--ink); font-size:13px; box-shadow:0 2px 6px rgba(0,0,0,.25); }
  #p-prev { left:6px; } #p-next { right:6px; }
  #p-name { font-family:"Ma Shan Zheng",cursive; font-size:17px; text-align:center; margin-top:7px; letter-spacing:2px; }
  #p-cap { font-size:12px; color:var(--soft); text-align:center; min-height:17px; margin-top:1px; }
  #p-dots { display:flex; justify-content:center; gap:5px; margin-top:5px; }
  .p-dot { width:6px; height:6px; border-radius:50%; background:#d8cfbc; cursor:pointer; }
  .p-dot.now { background:var(--accent); transform:scale(1.3); }

  /* ── 叙事卡 ── */
  #story { width:calc(min(1280px,100vw) - 48px); padding:6px 0; }
  #story-card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 6px 18px rgba(74,66,56,.1); padding:10px 20px 12px; display:flex; gap:14px; align-items:baseline; }
  #story-card .s-head { font-size:12px; color:var(--accent); letter-spacing:2px; white-space:nowrap; }
  #story-card .s-text { font-size:16px; letter-spacing:1px; line-height:1.45; }
  #story-card .s-text::after { content:"✎"; margin-left:8px; color:#c8bda8; animation:blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* ── 控制 ── */
  #controls { width:calc(min(1280px,100vw) - 48px); padding:2px 0 12px; }
  #scrub { width:100%; -webkit-appearance:none; height:6px; border-radius:3px; outline:none; background:linear-gradient(90deg,var(--accent) var(--p,0%),#e0d5c0 var(--p,0%)); }
  #scrub::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--card); border:3px solid var(--accent); cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.2); }
  #ctrl-row { display:flex; align-items:center; gap:8px; margin-top:7px; flex-wrap:wrap; }
  .cbtn { font-family:inherit; font-size:14px; cursor:pointer; letter-spacing:1px; background:var(--card); color:var(--ink); border:1.5px solid var(--line); padding:6px 15px; border-radius:20px; box-shadow:0 2px 6px rgba(74,66,56,.1); }
  .cbtn:hover { border-color:var(--accent); color:var(--accent); }
  #daychips { display:flex; gap:5px; flex-wrap:wrap; margin-left:auto; }
  .chip { font-size:11.5px; min-width:33px; text-align:center; padding:4px 6px; border-radius:12px; background:var(--card); color:var(--soft); cursor:pointer; border:1.5px solid var(--line); }
  .chip.now { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.past { opacity:.5; }
</style>
</head>
<body>
  <header>
    <div class="chapter">
      <div class="c-no" id="c-no">第一天 · DAY 1/13</div>
      <h1 id="c-title">抵达 + 蓝湖</h1>
    </div>
    <div class="clockbox">
      <div class="time" id="h-clock">00:00</div>
      <div class="date" id="h-date">1月11日 周一 · 冰岛</div>
    </div>
  </header>

  <div id="stage">
    <svg class="lay" id="Lfar"  preserveAspectRatio="xMinYMax slice"></svg>
    <svg class="lay" id="Lmid"  preserveAspectRatio="xMinYMax slice"></svg>
    <svg class="lay" id="Lmain" preserveAspectRatio="xMinYMax slice"></svg>
    <div id="aurora"></div>
    <div id="tint"></div>
    <div id="placename"></div>
    <div id="tbadge"></div>
    <div id="photo">
      <div id="p-frame">
        <img id="p-img" alt="">
        <button class="p-arrow" id="p-prev">‹</button>
        <button class="p-arrow" id="p-next">›</button>
      </div>
      <div id="p-name"></div>
      <div id="p-cap"></div>
      <div id="p-dots"></div>
    </div>
    <div id="rflash"></div>
  </div>

  <div id="story">
    <div id="story-card">
      <span class="s-head" id="s-head">D1 · 1月11日 周一</span>
      <span class="s-text" id="s-text"></span>
    </div>
  </div>

  <div id="controls">
    <input type="range" id="scrub" min="0" max="1299" value="0">
    <div id="ctrl-row">
      <button class="cbtn" id="btn-play">⏸ 暂停</button>
      <button class="cbtn" id="btn-prev">← 前一天</button>
      <button class="cbtn" id="btn-next">后一天 →</button>
      <button class="cbtn" id="btn-speed">1×</button>
      <div id="daychips"></div>
    </div>
  </div>

<script src="game-data.js"></script>
<script>
/* ═════════ 天空（绘本奶色系 · 1 月真实日照） ═════════ */
const SKY = {
  ice: [ [0,52,64,100, 96,106,142, 1,-1], [9.5,70,84,120, 120,128,160, .5,-1], [11,150,178,208, 244,214,180, 0,.08],
         [13,168,200,226, 240,240,228, 0,.7], [15.5,172,182,208, 248,214,164, 0,.3], [16.8,130,116,150, 238,164,140, .1,-.05],
         [18.2,60,70,104, 104,110,146, .8,-1], [24,52,64,100, 96,106,142, 1,-1] ],
  trom:[ [0,40,50,84, 80,90,124, 1,-1], [9,54,66,102, 100,110,144, .5,-1], [11,96,112,150, 150,142,170, .1,-1],
         [13,110,126,160, 168,154,176, 0,-1], [15,80,92,130, 120,110,146, .3,-1], [16.5,48,58,92, 86,96,130, 1,-1],
         [24,40,50,84, 80,90,124, 1,-1] ],
  osl: [ [0,48,60,96, 92,102,138, 1,-1], [8.5,64,78,114, 116,124,158, .4,-1], [9.5,148,172,202, 244,212,178, 0,.1],
         [12,166,198,224, 242,240,230, 0,.75], [15.3,170,180,206, 248,212,162, 0,.3], [16.3,126,114,148, 236,160,140, .15,-.05],
         [18,56,66,100, 100,106,142, .9,-1], [24,48,60,96, 92,102,138, 1,-1] ],
};
function skyAt(region, h){
  const kf = SKY[region]||SKY.ice; let a=kf[0], b=kf[kf.length-1];
  for (let i=0;i<kf.length-1;i++) if (h>=kf[i][0]&&h<=kf[i+1][0]){ a=kf[i]; b=kf[i+1]; break; }
  const f = Math.min(1,Math.max(0,(h-a[0])/((b[0]-a[0])||1)));
  const L=(x,y)=>Math.round(x+(y-x)*f);
  return { top:[L(a[1],b[1]),L(a[2],b[2]),L(a[3],b[3])], bot:[L(a[4],b[4]),L(a[5],b[5]),L(a[6],b[6])],
           stars:a[7]+(b[7]-a[7])*f, sun:a[8]+(b[8]-a[8])*f };
}
const REGION_TXT = {ice:'冰岛 🇮🇸', trom:'挪威 · 特罗姆瑟 🇳🇴', osl:'挪威 · 奥斯陆 🇳🇴'};
const CN = ['一','二','三','四','五','六','七','八','九','十','十一','十二','十三'];
const WORLD_W = 19800, GY = 310; // 地面线 y

/* ═════════ 地标插画（原点 = 地面落点） ═════════ */
function pine(x,y,s){return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-2.5" y="0" width="5" height="10" rx="2" fill="#8a6f55"/><path d="M0-34 L13-6 L-13-6 Z" fill="#7fa38a"/><path d="M0-24 L15 2 L-15 2 Z" fill="#6f957c"/><path d="M-9-22 Q0-26 9-22 L7-16 Q0-19-7-16 Z" fill="#f4f1e8"/></g>`}
function house(x,y,w,h,c,roof){return `<g><rect x="${x}" y="${y-h}" width="${w}" height="${h}" rx="4" fill="${c}"/><path d="M${x-6} ${y-h} L${x+w/2} ${y-h-15} L${x+w+6} ${y-h} Z" fill="${roof}"/><rect x="${x+w*0.2}" y="${y-h+9}" width="${w*0.2}" height="${w*0.2}" rx="2" fill="#ffe9b0"/><rect x="${x+w*0.6}" y="${y-h+9}" width="${w*0.2}" height="${w*0.2}" rx="2" fill="#ffe9b0"/></g>`}
const LM = {
  city(){ return house(-90,0,54,42,'#e8a2a2','#b8503f')+house(-25,0,48,54,'#a8c8dc','#5f87a8')+house(33,0,56,38,'#f2d492','#c8995a')+
    `<rect x="100" y="-88" width="40" height="88" rx="3" fill="#e8e2d4"/><path d="M95-88 L120-118 L145-88 Z" fill="#8a7f70"/>`; },
  airport(){ return `<rect x="-70" y="-46" width="120" height="46" rx="7" fill="#dfe5ea"/><rect x="-52" y="-62" width="20" height="16" rx="3" fill="#b9c4cd"/><rect x="-58" y="-36" width="16" height="11" rx="2" fill="#a8c8dc"/><rect x="-30" y="-36" width="16" height="11" rx="2" fill="#a8c8dc"/><rect x="-2" y="-36" width="16" height="11" rx="2" fill="#a8c8dc"/>`+
    `<g transform="translate(80,-14)"><ellipse cx="0" cy="0" rx="34" ry="9" fill="#f4f1e8"/><path d="M-8-3 L-32-17 L-25-19 L-2-7 Z" fill="#d9705f"/><path d="M28-1 L38-9 L41-6 L33 0 Z" fill="#5f87a8"/></g>`; },
  lagoon(){ return `<ellipse cx="0" cy="-16" rx="105" ry="30" fill="#4a4640"/><ellipse cx="0" cy="-14" rx="88" ry="23" fill="#a8d8e8"/><ellipse cx="-8" cy="-17" rx="60" ry="15" fill="#c4e6f2"/>`+
    `<path d="M-40-40 q5-14 0-24 M-18-44 q-5-12 2-24 M40-38 q5-12 0-22" stroke="#fff" stroke-width="4" fill="none" opacity=".6" stroke-linecap="round"/>`+
    `<rect x="44" y="-66" width="66" height="34" rx="8" fill="#e8e2d4"/><rect x="56" y="-56" width="13" height="10" rx="2" fill="#ffe9b0"/><rect x="76" y="-56" width="13" height="10" rx="2" fill="#ffe9b0"/>`; },
  rift(){ return `<path d="M-95 0 L-55-95 L5-95 L-30 0 Z" fill="#8a7f70"/><path d="M95 0 L55-95 L-5-95 L30 0 Z" fill="#7a6f60"/><path d="M-30 0 L-5-95 L5-95 L30 0 Z" fill="#f4f1e8"/>`+
    `<path d="M-55-95 L5-95 L2-84 L-52-84 Z" fill="#e8e2d4"/><path d="M-5-95 L55-95 L52-84 L-2-84 Z" fill="#e8e2d4"/>`; },
  geysir(){ return `<ellipse cx="0" cy="-8" rx="62" ry="13" fill="#a8d8e8"/><ellipse cx="0" cy="-10" rx="46" ry="9" fill="#c4e6f2"/>`+
    `<g><animateTransform attributeName="transform" type="scale" values="1 0.55;1 1;1 0.55" dur="3s" repeatCount="indefinite"/>`+
    `<path d="M-10-14 Q-14-64 -6-98 Q0-118 6-98 Q14-64 10-14 Z" fill="#e8f4fa"/><circle cx="0" cy="-108" r="11" fill="#e8f4fa" opacity=".85"/><circle cx="-12" cy="-94" r="6" fill="#e8f4fa" opacity=".6"/><circle cx="12" cy="-90" r="5" fill="#e8f4fa" opacity=".6"/></g>`; },
  waterfall(){ return `<path d="M-70 0 L-70-120 L70-120 L70 0 Z" fill="#7a6f60"/><path d="M-70-120 L70-120 L70-108 L-70-108 Z" fill="#e8e2d4"/>`+
    `<rect x="-26" y="-118" width="52" height="102" fill="#e8f4fa"/><rect x="-18" y="-118" width="8" height="102" fill="#fff" opacity=".7"/><rect x="10" y="-118" width="6" height="102" fill="#fff" opacity=".6"/>`+
    `<ellipse cx="0" cy="-10" rx="58" ry="13" fill="#c4e6f2"/><circle cx="-26" cy="-18" r="7" fill="#fff" opacity=".7"/><circle cx="24" cy="-16" r="6" fill="#fff" opacity=".6"/>`+
    `<path d="M-52-58 Q0-96 52-58" stroke="#f2b8c6" stroke-width="5" fill="none" opacity=".7"/><path d="M-46-50 Q0-84 46-50" stroke="#ffe9b0" stroke-width="4" fill="none" opacity=".7"/>`; },
  waterfall2(){ return `<path d="M-75 0 L-75-135 L75-135 L75 0 Z" fill="#7a6f60"/><path d="M-75-135 L75-135 L75-124 L-75-124 Z" fill="#e8e2d4"/>`+
    `<rect x="-40" y="-133" width="80" height="42" fill="#e8f4fa"/><rect x="-48" y="-91" width="96" height="12" fill="#7a6f60"/><rect x="-34" y="-79" width="68" height="72" fill="#e8f4fa"/><rect x="-26" y="-79" width="9" height="72" fill="#fff" opacity=".6"/><rect x="8" y="-133" width="8" height="42" fill="#fff" opacity=".6"/>`+
    `<ellipse cx="0" cy="-6" rx="62" ry="12" fill="#c4e6f2"/>`; },
  manor(){ return pine(-105,-2,1)+pine(100,-2,0.85)+
    `<rect x="-56" y="-52" width="112" height="52" rx="7" fill="#e8e2d4"/><path d="M-64-50 Q0-84 64-50 L64-42 Q0-74-64-42 Z" fill="#7fa38a"/><rect x="-38" y="-38" width="14" height="12" rx="2" fill="#ffe9b0"/><rect x="-8" y="-38" width="14" height="12" rx="2" fill="#ffe9b0"/><rect x="24" y="-38" width="14" height="12" rx="2" fill="#ffe9b0"/><rect x="-9" y="-22" width="16" height="22" rx="3" fill="#8a6f55"/>`+
    `<g transform="translate(76,-8)"><ellipse cx="0" cy="0" rx="17" ry="10" fill="#a8795a"/><rect x="-12" y="5" width="4" height="12" rx="2" fill="#8a6248"/><rect x="7" y="5" width="4" height="12" rx="2" fill="#8a6248"/><circle cx="16" cy="-8" r="7" fill="#a8795a"/></g>`; },
  blacksand(){ return `<ellipse cx="0" cy="-4" rx="110" ry="16" fill="#3f3b38"/><path d="M-110-12 Q-40-20 30-14 Q80-8 110-14 L110-2 L-110-2 Z" fill="#8fb8cc"/>`+
    `<path d="M-108-13 Q-40-21 30-15" stroke="#fff" stroke-width="3.5" fill="none" opacity=".75"/>`+
    `<path d="M30-12 L42-70 L54-12 Z" fill="#3a3630"/><path d="M64-12 L76-52 L88-12 Z" fill="#3a3630"/>`+
    `<rect x="-70" y="-26" width="8" height="26" rx="3" fill="#3a3630"/><rect x="-58" y="-22" width="8" height="22" rx="3" fill="#3a3630"/><rect x="-46" y="-19" width="8" height="19" rx="3" fill="#3a3630"/>`; },
  glacier(){ return `<ellipse cx="0" cy="-8" rx="115" ry="20" fill="#a8cfe0"/>`+
    `<path d="M-110-16 Q-70-88 -20-30 Q20-100 60-34 Q90-70 112-24 L112-10 L-110-10 Z" fill="#dceef6"/>`+
    `<path d="M-70-14 L-46-48 L-20-14 Z" fill="#eaf6fb"/><path d="M-62-14 L-45-38 L-28-14 Z" fill="#bfe0ee"/>`+
    `<path d="M18-12 L44-46 L72-12 Z" fill="#eaf6fb"/><path d="M28-12 L46-34 L64-12 Z" fill="#bfe0ee"/>`+
    `<ellipse cx="-8" cy="-6" rx="12" ry="4" fill="#eaf6fb"/><ellipse cx="86" cy="-5" rx="14" ry="5" fill="#eaf6fb"/>`; },
  town(){ return house(-95,0,50,40,'#e8a2a2','#b8503f')+house(-35,0,44,50,'#a8c8dc','#5f87a8')+house(20,0,52,36,'#f2d492','#c8995a')+
    `<rect x="82" y="-96" width="46" height="96" fill="#f4f1e8"/><path d="M82-96 L105-132 L128-96 Z" fill="#f4f1e8"/><path d="M90-96 L105-120 L120-96 Z" fill="#e0d5c0"/><rect x="99" y="-72" width="10" height="15" rx="5" fill="#5f87a8"/>`; },
  harbor(){ return `<ellipse cx="0" cy="-6" rx="120" ry="18" fill="#9cc2d8"/>`+house(-105,-16,42,32,'#d9705f','#8a4a3f')+house(-55,-16,38,38,'#f2d492','#c8995a')+
    `<path d="M-30-14 Q30-56 90-14" stroke="#e8e2d4" stroke-width="5" fill="none"/><path d="M-18-14 L-18-26 M18-14 L18-38 M58-14 L58-30" stroke="#e8e2d4" stroke-width="3"/>`+
    `<g transform="translate(30,-20)"><path d="M-24 0 L24 0 L17 10 L-17 10 Z" fill="#b8503f"/><rect x="-8" y="-10" width="17" height="10" rx="2" fill="#f4f1e8"/><rect x="-1" y="-19" width="3" height="9" fill="#8a6f55"/></g>`+
    `<g transform="translate(80,-12)"><path d="M-17 0 L17 0 L12 8 L-12 8 Z" fill="#5f87a8"/></g>`; },
  cable(){ return `<path d="M40 0 L110-140 L180 0 Z" fill="#c8d8e4"/><path d="M98-118 L110-140 L124-118 Q110-110 98-118 Z" fill="#f4f8fa"/>`+

/* ═════════ 搭建世界（三层视差） ═════════ */

const stage=$('stage'), LF=$('Lfar'), LMid=$('Lmid'), LMn=$('Lmain');

/* ═════════ 时间轴：每步分配真实秒数（无聊的压缩掉） ═════════ */
const STEPS=[];
DAYS.forEach((d,di)=>d.steps.forEach(s=>{
  const dur=s.t1-s.t0;
  const travel=(s.mode==='car'||s.mode==='plane'||s.mode==='boat')&&s.from!==s.to;
  let sec;
  if (travel) sec=3.2+Math.min(4.5,dur*0.9);
  else if (s.mode==='sleep') sec=1.6;
  else sec=2.0+Math.min(3.6,dur*0.55);
  STEPS.push({...s, day:di, travel, sec});
}));
let acc=0; STEPS.forEach(s=>{s.a0=acc; acc+=s.sec; s.a1=acc;});
const T_REAL=acc;

/* ═════════ 状态 ═════════ */
let T=0, playing=true, speed=1, camX=0;
let curKey=null, curMode=null, curRegion=null, swapGuard=0;
const MODE_EMOJI={car:'🚐',plane:'✈️',boat:'🚢'};
const easeIO = p => p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
function fmtClock(h){ const H=Math.floor(h),M=Math.floor((h-H)*60); return `${String(H).padStart(2,'0')}:${String(M).padStart(2,'0')}`; }

/* ═════════ 照片卡 ═════════ */
let gLoc=null,gIdx=0,gTimer=null;
function setPhoto(loc, away){
  $('photo').classList.toggle('away', !!away);
  if (gLoc===loc) return;
  gLoc=loc; gIdx=0;
  $('p-name').textContent=LOC[loc].n;
  const ph=GALLERY[loc]||[], dots=$('p-dots'); dots.innerHTML='';
  ph.forEach((_,i)=>{ const d=document.createElement('span'); d.className='p-dot'; d.onclick=()=>{showP(i);resetPT();}; dots.appendChild(d); });
  showP(0,true);
  const el=$('photo'); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  resetPT();
  ph.slice(1).forEach(u=>{ const im=new Image(); im.src=u; });
}
function showP(i, instant){
  const ph=GALLERY[gLoc]||[]; if(!ph.length) return;
  gIdx=(i+ph.length)%ph.length;
  const img=$('p-img');
  const apply=()=>{ img.src=ph[gIdx]; img.onload=()=>img.style.opacity=1;
    img.onerror=()=>{ img.style.opacity=1;
      if (img.src.includes('1280px')){ img.onerror=()=>{img.style.opacity=1;}; img.src=img.src.replace('1280px','800px'); } }; };
  if (instant){ apply(); img.style.opacity=1; } else { img.style.opacity=0; setTimeout(apply,200); }
  const caps=CAPS[gLoc]||['']; $('p-cap').textContent=caps[gIdx%caps.length]||'';
  [...$('p-dots').children].forEach((d,j)=>d.classList.toggle('now',j===gIdx));
}
function resetPT(){ clearInterval(gTimer); gTimer=setInterval(()=>showP(gIdx+1),4500); }
$('p-prev').onclick=()=>{showP(gIdx-1);resetPT();};
$('p-next').onclick=()=>{showP(gIdx+1);resetPT();};

/* ═════════ 打字机 ═════════ */
let typeTimer=null;
function typeText(str){
  clearInterval(typeTimer); const el=$('s-text'); el.textContent=''; let i=0;
  typeTimer=setInterval(()=>{ el.textContent=str.slice(0,++i); if(i>=str.length) clearInterval(typeTimer); },42);
}

/* ═════════ 步骤切换 ═════════ */
const charG=$('charG');
function spriteFor(s){
  if (s.travel) return s.mode==='plane'?planeSprite():s.mode==='boat'?boatSprite():vanSprite();
  return s.mode==='walk'?walkSprite():idleSprite();
}
function onStepChange(s){
  const loc = s.travel ? s.to : s.from;
  const region = s.region || DAYS[s.day].region;
  const spriteKey = s.travel?'t-'+s.mode:s.mode;
  if (spriteKey!==curMode){ curMode=spriteKey; charG.innerHTML=spriteFor(s); }
  /* 地名横幅 */
  $('placename').classList.remove('show');
  setTimeout(()=>{ $('placename').textContent = s.travel ? `${MODE_EMOJI[s.mode]} 前往 · ${LOC[s.to].n}` : LOC[loc].b; $('placename').classList.add('show'); },350);
  /* 照片卡：到达弹出，路上收起 */
  setPhoto(loc, s.travel);
  /* 换国家 */
  if (curRegion && region!==curRegion){
    $('rflash').textContent=REGION_TXT[region]||'';
    $('rflash').classList.add('show');
    setTimeout(()=>$('rflash').classList.remove('show'),1500);
  }
  curRegion=region;
  /* 章节 + 叙事 */
  $('c-no').textContent=`第${CN[s.day]}天 · DAY ${s.day+1}/13`;
  $('c-title').textContent=DAYS[s.day].title;
  $('s-head').textContent=`D${s.day+1} · ${DAYS[s.day].date} ${DAYS[s.day].wd}`;
  typeText(s.label);
  [...$('daychips').children].forEach((c,j)=>{ c.classList.toggle('now',j===s.day); c.classList.toggle('past',j<s.day); });
  $('tbadge').style.display = s.travel?'block':'none';
}

/* ═════════ 主渲染 ═════════ */
function stepAtT(t){
  for (const s of STEPS) if (t>=s.a0 && t<s.a1) return s;
  return STEPS[STEPS.length-1];
}
let lastStars=-1, lastSunX=-1, snapCam=false;
function render(){
  const s=stepAtT(T);
  const p=Math.min(1,(T-s.a0)/s.sec);
  const key=s.day*100+STEPS.indexOf(s);
  if (key!==curKey){ curKey=key; onStepChange(s); }
  const h=s.t0+p*(s.t1-s.t0);
  const region=s.region||DAYS[s.day].region;
  const sky=skyAt(region,h);
  /* 角色位置 */
  let cx, cy=GY;
  if (s.travel){
    const e=easeIO(p);
    cx=LOC[s.from].x+(LOC[s.to].x-LOC[s.from].x)*e;
    if (s.mode==='plane') cy=GY-36-110*Math.sin(Math.PI*Math.min(1,p*1.15));
    else if (s.mode==='boat') cy=GY-14;
  } else {
    cx=LOC[s.from].x;
    if (s.mode==='walk') cx+=Math.sin(p*Math.PI*2*Math.max(1,Math.round(s.sec/2.2)))*55;
  }
  charG.setAttribute('transform',`translate(${cx},${cy})`);
  /* 镜头 */
  const rect=stage.getBoundingClientRect();
  const viewW=400*(rect.width/Math.max(1,rect.height));
  const target=Math.max(0,Math.min(WORLD_W-viewW, cx-viewW*0.42));
  if (snapCam){ camX=target; snapCam=false; } else { camX+=(target-camX)*0.12; }
  LF.setAttribute('viewBox',`${camX*0.35} 0 ${viewW} 400`);
  LMid.setAttribute('viewBox',`${camX*0.65} 0 ${viewW} 400`);
  LMn.setAttribute('viewBox',`${camX} 0 ${viewW} 400`);
  /* 天空 */
  stage.style.background=`linear-gradient(180deg,rgb(${sky.top}) 0%,rgb(${sky.bot}) 100%)`;
  $('tint').style.background=`rgba(26,34,72,${(sky.stars*0.30).toFixed(3)})`;
  $('aurora').style.opacity=(region==='trom'&&sky.stars>0.5)?'1':'0';
  /* 太阳/月亮/星星（贴在远层，跟随镜头） */
  if (Math.abs(sky.stars-lastStars)>0.03){
    lastStars=sky.stars;
    const sg=$('starsG');
    if (sky.stars>0.12 && !sg.children.length){
      let st=''; for(let i=0;i<200;i++){ st+=`<circle cx="${(i*379)%7400}" cy="${(i*97)%210+10}" r="${1+(i%3)*0.5}" fill="#fffdf7"/>`; }
      sg.innerHTML=st;
    }
    sg.setAttribute('opacity',sky.stars.toFixed(2));
  }
  const sunX=camX*0.35+viewW*(0.18+0.64*Math.max(0,sky.sun)), sunY=sky.sun>=0?Math.max(46,180-120*Math.sin(Math.PI*Math.min(1,sky.sun))):-100;
  $('sunG').setAttribute('transform',`translate(${sunX},${sunY})`);
  $('moonG').setAttribute('transform',`translate(${camX*0.35+viewW*0.78},${sky.stars>0.35?70:-100})`);
  /* 头部 + 计时牌 */
  $('h-clock').textContent=fmtClock(h);
  $('h-date').textContent=`${DAYS[s.day].date} ${DAYS[s.day].wd} · ${(REGION_TXT[region]||'').replace(/\s*🇮🇸|🇳🇴/g,'')}`;
  if (s.travel){
    $('tbadge').textContent=`${MODE_EMOJI[s.mode]} 已走 ${Math.round((h-s.t0)*60)} 分钟 / 全程 ${Math.round((s.t1-s.t0)*60)} 分钟`;
  }
  const pct=T/T_REAL*100, sc=$('scrub');
  sc.value=Math.round(T/T_REAL*1299); sc.style.setProperty('--p',pct+'%');
}

/* ═════════ 控件 ═════════ */
const SPEEDS=[1,2,4,8]; let spIdx=0;
function setPlaying(p){ playing=p; $('btn-play').textContent=p?'⏸ 暂停':'▶ 播放'; }
$('btn-play').onclick=()=>{ if(T>=T_REAL-0.05) T=0; setPlaying(!playing); };
$('btn-speed').onclick=()=>{ spIdx=(spIdx+1)%SPEEDS.length; speed=SPEEDS[spIdx]; $('btn-speed').textContent=speed+'×'; };
function tauOf(di,h){ for(const s of STEPS) if(s.day===di&&h>=s.t0&&h<s.t1) return s.a0+((h-s.t0)/(s.t1-s.t0))*s.sec; for(const s of STEPS) if(s.day===di) return s.a0; return 0; }
function jumpDay(d){ T=tauOf(Math.max(0,Math.min(12,d)), 8.2); }
$('btn-prev').onclick=()=>jumpDay(stepAtT(T).day-1);
$('btn-next').onclick=()=>jumpDay(stepAtT(T).day+1);
$('scrub').addEventListener('input',e=>{ T=e.target.value/1299*T_REAL; });
const chips=$('daychips');
DAYS.forEach((d,i)=>{ const c=document.createElement('span'); c.className='chip'; c.textContent='D'+(i+1); c.title=d.date+' '+d.title; c.onclick=()=>jumpDay(i); chips.appendChild(c); });

/* ?t=3.6 → 第3天 60%，静止定位（截图用） */
const qp=new URLSearchParams(location.search);
if (qp.has('t')){ const v=parseFloat(qp.get('t')); const d=Math.max(1,Math.floor(v)); T=tauOf(d-1,(v-d)*24); snapCam=true; setPlaying(false); }

let lastNow=performance.now();
function frame(now){
  const dt=Math.min(0.1,(now-lastNow)/1000); lastNow=now;
  if (playing){ T+=dt*speed; if(T>=T_REAL){T=T_REAL-0.01; setPlaying(false);} }
  render();
  requestAnimationFrame(frame);
}
render();
requestAnimationFrame(frame);
</script>
</body>
